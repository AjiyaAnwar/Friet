x-common-env: &common-env
  APP_ENV: ${APP_ENV:-development}
  DEBUG: ${DEBUG:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-freightcore}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
  POSTGRES_DB: ${POSTGRES_DB:-freightcore}
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-freightcore}:${RABBITMQ_PASSWORD:-change_me_in_production}@rabbitmq:5672/
  ELASTICSEARCH_URL: http://elasticsearch:9200
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me-use-openssl-rand-hex-32}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-only-generate-with-cryptography-fernet-generate-key}
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freightcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-freightcore}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freightcore} -d ${POSTGRES_DB:-freightcore}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - freightcore
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - freightcore
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-freightcore}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change_me_in_production}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - freightcore
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - freightcore
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    environment:
      <<: *common-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - freightcore
    restart: unless-stopped
    profiles: ["prod"]

  api-dev:
    build:
      context: .
      target: runtime
    environment:
      <<: *common-env
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:rw
      - ./alembic:/app/alembic:rw
      - ./tests:/app/tests:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks:
      - freightcore
    profiles: ["dev", "default"]

  worker:
    build:
      context: .
      target: runtime
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "-Q", "default,outbox,search,sla"]
    networks:
      - freightcore
    restart: unless-stopped
    profiles: ["dev", "prod", "default"]

  beat:
    build:
      context: .
      target: runtime
    environment:
      <<: *common-env
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]
    networks:
      - freightcore
    restart: unless-stopped
    profiles: ["dev", "prod", "default"]

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - freightcore
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports:
      - "3001:3000"
    networks:
      - freightcore
    profiles: ["observability"]

  jaeger:
    image: jaegertracing/all-in-one:1.63
    ports:
      - "16686:16686"
      - "4317:4317"
    networks:
      - freightcore
    profiles: ["observability"]

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:

networks:
  freightcore:
    driver: bridge
